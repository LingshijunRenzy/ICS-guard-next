# 本地开发 profile（宿主机直接启动，非 Docker）
# 使用方式: java -jar app.jar --spring.profiles.active=local
# 或在 IDE 中设置 spring.profiles.active=local
#
# 前提: docker compose up -d redpanda postgres redis kafka-init
# 这样基础设施在 Docker 中运行，Backend 在宿主机 IDE 中调试

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ics_guard

  jpa:
    show-sql: true         # 本地开发打印 SQL

  data:
    redis:
      host: 127.0.0.1

  kafka:
    bootstrap-servers: 127.0.0.1:9093

app:
  controller:
    base-url: http://127.0.0.1:8000
  error:
    include-details: true    # 本地开发返回内部错误详情
